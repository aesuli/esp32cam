; PlatformIO build configuration for ESP32-CAM (AI-Thinker)
; Flash with: pio run -t upload
; Monitor: pio device monitor

[platformio]
src_dir = .

[env:esp32cam]
platform    = espressif32
board       = esp32cam
framework   = arduino

monitor_speed = 115200
upload_speed  = 115200

; OTA requires two application slots instead of the single huge-app layout.
board_build.partitions = partitions_ota.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
