; PlatformIO build configuration for ESP32-CAM (AI-Thinker)
; Flash with: pio run -t upload
; Monitor: pio device monitor

[platformio]
src_dir = .

[env:esp32cam]
platform    = espressif32
board       = esp32cam
framework   = arduino

upload_speed  = 115200
monitor_speed = 115200

; OTA requires two application slots instead of the single huge-app layout.
board_build.partitions = partitions_ota.csv
; With an OTA-only table (no factory app), the first serial flash must target
; the first OTA slot instead of the default 0x10000 factory offset.
board_upload.offset_address = 0x20000

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    '-DFIRMWARE_VERSION="1.0.0"'
